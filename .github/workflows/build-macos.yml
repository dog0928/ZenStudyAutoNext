name: Build macOS Safari Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build macOS app and Safari extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "zenstudy-auto-next-github/ZenStudy-Auto-Next-extension.xcodeproj" \
            -scheme "ZenStudy-Auto-Next-extension" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package built app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/ZenStudy-Auto-Next-extension.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "dist/ZenStudy-Auto-Next-extension-macos-arm64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ZenStudyAutoNext-macOS
          path: dist/ZenStudy-Auto-Next-extension-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download successful macOS build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ZenStudyAutoNext-macOS
          path: dist

      - name: Verify ZIP and create checksum
        shell: bash
        run: |
          set -euo pipefail
          zip="dist/ZenStudy-Auto-Next-extension-macos-arm64.zip"
          test -s "$zip"
          sha256sum "$zip" > "$zip.sha256"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="build-$GITHUB_RUN_NUMBER"
          zip="dist/ZenStudy-Auto-Next-extension-macos-arm64.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no duplicate release will be created."
          else
            gh release create "$tag" "$zip" "$zip.sha256" \
              --target "$GITHUB_SHA" \
              --title "ZenStudyAutoNext Build #$GITHUB_RUN_NUMBER" \
              --generate-notes \
              --notes "Automated macOS Safari extension build. This is ad-hoc signed only: no Developer ID certificate or Apple notarization. For testing, enable unsigned extensions in Safari developer settings." \
              --prerelease
          fi
